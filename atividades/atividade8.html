<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function  exibirData(){
        
            var dia = new Date().getDay()
            var mes = new Date().getMonth()
            var ano= new Date().getFullYear() 
            var hora= new Date().getHours()
            var minutos = new Date().getMinutes()

            var data = dia + ' / ' + mes + ' / ' + ano + ' Horario: ' + hora + ' : ' + minutos
          document.querySelector('#exibir').innerHTML= data
        }
    </script>
</head>
<body>
    <p id="exibir"></p>
    <button onclick="exibirData()">Clique Aqui</button>
</body>
</html>
