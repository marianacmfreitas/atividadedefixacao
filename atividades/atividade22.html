<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <script>
        var cliques = 0

        function contar(){
            cliques = cliques + 1
            document.querySelector('p').innerHTML = "Cliques: " + cliques
        }
    </script>
</head>

<body>

    <p>Cliques: 0</p>

    <button onclick="contar()">Clique Aqui</button>

</body>
</html>
