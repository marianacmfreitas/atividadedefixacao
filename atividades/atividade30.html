<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function clicar(){
            var botao = document.querySelector('button')
            botao.innerHTML = 'Clicado!'
        }
    </script>
</head>

<body>

    <button onclick="clicar()">Clique Aqui</button>

</body>
</html>
