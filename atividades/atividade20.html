<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script>
        function branco(){
            document.body.style.backgroundColor = 'white'
        }

        function preto(){
            document.body.style.backgroundColor = 'black'
        }
    </script>
</head>

<body>

    <button onclick="branco()">Fundo Branco</button>
    <button onclick="preto()">Fundo Preto</button>

</body>
</html>
