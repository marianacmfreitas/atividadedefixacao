<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function cor(){
            var div = document.querySelector('div')
            div.style.backgroundColor = 'red'
        }
    </script>
</head>

<body>

    <div onmouseover="cor()" style="width: 200px; height: 200px; background-color: blue;"></div>

</body>
</html>
