<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer>
        function botao(){
            var div = document.querySelector('div')

            var novo = document.createElement('h3')
            novo.innerHTML = 'Novo elemento'

            console.log (div.appendChild(novo))
        }
         

    </script>
</head>
<body>
    <button type="button" class="botao" onclick="botao()">Calcular</button>
    <div></div>
</body>
</html>
