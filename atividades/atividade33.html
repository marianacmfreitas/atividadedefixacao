<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <script>
        function remover(){
            var ul = document.querySelector('ul')
            var li = ul.lastElementChild
            ul.removeChild(li)
        }
    </script>
</head>

<body>

    <ul>
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item</li>
    </ul>

    <button onclick="remover()">Remover último</button>

</body>
</html>
