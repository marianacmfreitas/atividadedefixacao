<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function italico(){
            var p = document.querySelector('p')
            p.style.fontStyle = 'italic'
        }
    </script>
</head>

<body>

    <p>Esse texto ficará em itálico.</p>

    <button onclick="italico()">Deixar Itálico</button>

</body>
</html>
