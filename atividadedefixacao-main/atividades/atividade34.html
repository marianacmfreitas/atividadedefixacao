<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <script>
        function resetar(){
            var p = document.querySelector('p')
            p.innerHTML = 'Texto resetado'
        }
    </script>
</head>

<body>

    <p>Esse é o texto original do parágrafo.</p>

    <button onclick="resetar()">Resetar texto</button>

</body>
</html>
