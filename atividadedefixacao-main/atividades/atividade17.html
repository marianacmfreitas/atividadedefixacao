<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        function mostrar(){
            var p = document.querySelector('p')
            p.style.display = 'block'
        }
    </script>
</head>

<body>

    <p style="display: none;">Esse é o parágrafo escondido.</p>

    <button onclick="mostrar()">Mostrar parágrafo</button>

</body>
</html>
