<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <script>
        var contador = 0

        function aumentar(){
            contador = contador + 1

            var p = document.querySelector('p')
            p.innerHTML = contador
        }
    </script>
</head>

<body>

    <p>0</p>

    <button onclick="aumentar()">Clique Aqui</button>

</body>
</html>
